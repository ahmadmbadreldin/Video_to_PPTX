[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video2brandedpptx"
version = "0.1.0"
description = "Offline-first reconstruction and branding of presentation screen recordings"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Ahmad Badr Eldin", email = "ahmadmbadreldin@gmail.com"},
]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "Pillow>=10.2",
  "python-pptx>=0.6.23",
  "PyYAML>=6.0",
]

[project.urls]
Author = "https://www.linkedin.com/in/ahmadbadreldin"

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
ui = ["streamlit>=1.32"]
svg = ["cairosvg>=2.7"]
windows = ["pywin32>=306; platform_system == 'Windows'"]
test = ["pytest>=8", "pytest-cov>=5"]
all = ["pytesseract>=0.3.10", "streamlit>=1.32"]

[project.scripts]
video2pptx = "video2pptx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

